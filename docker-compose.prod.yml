services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-cryptvault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cryptvault}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env.prod, see README in this file}"
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY in .env.prod, see README in this file}"
      WEBAUTHN_RP_ID: "${DOMAIN:?set DOMAIN in .env.prod, e.g. cryptvault.example.com}"
      WEBAUTHN_ORIGIN: https://${DOMAIN}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - file_storage:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?set in .env.prod}
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  file_storage:
  caddy_data:
  caddy_config:
